[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apply-agents"
version = "0.1.0"
description = "OpenAI Agents computer-use job apply harness (local Camoufox + resume PDF)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jared Stoddard" }]
dependencies = [
  "openai>=3.31.0",
  "python-dotenv>=1.0.0",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
local = [
  "openai-agents>=0.10.0",
  "camoufox[geoip]>=0.4.0",
  "playwright>=1.50.0,<1.63",
]

[project.scripts]
job-apply = "computer_use.apply:main"
job-worker = "computer_use.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
